name: KronoLatch CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-lint:
    name: Unit Tests & Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Lint with Ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Run Automated Pytest Suite
        run: uv run pytest -v

      - name: Run On-Demand Architectural Self-Test
        run: uv run kronolatch self-test

      - name: Validate Sample Trip JSON Schema
        run: |
          uv run python -c "
          import json
          from kronolatch.models import TripDAG
          with open('web/sample-trip.json') as f:
              data = json.load(f)
          TripDAG.model_validate(data)
          print('✓ web/sample-trip.json validates strictly against TripDAG models!')
          "
